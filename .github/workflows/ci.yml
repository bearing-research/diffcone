name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for commits outside the fixtures
        shell: bash
        run: |
          git config --global user.name "diffcone ci"
          git config --global user.email "ci@example.invalid"
      - run: uv sync --locked
      # Evidence tests need Python 3.12+ (sys.monitoring) and skip below it;
      # the Cython tests build a small extension with the runner's C compiler.
      - run: uv run pytest -q
        shell: bash

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uvx twine check dist/*
      - name: The wheel installs and runs outside the source tree
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/diffcone" --version
          "$RUNNER_TEMP/venv/bin/python" -c "import diffcone; print(diffcone.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
