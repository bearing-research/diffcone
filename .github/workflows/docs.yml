name: Docs

# Every pull request builds the site with --strict (a broken link or anchor
# fails). Pushes to main publish it as version "dev"; a release tag vX.Y.Z
# publishes it as "X.Y" with the alias "latest", which the site root opens.
# Until the first release, "dev" carries "latest" so links to it work.
#
# Versions are kept on the gh-pages branch by mike (Zensical's fork, until
# Zensical versions natively), and Pages publishes that branch itself
# (Settings > Pages > Source: Deploy from a branch, gh-pages, /). Publishing
# through an Actions deployment instead keys each deployment by commit, so a
# release tag on a commit main already deployed would publish nothing new.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group docs
      - name: The command reference matches the parser
        run: uv run python scripts/docs_cli.py --check
      - run: uv run --group docs zensical build --strict

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time: each one commits to gh-pages.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write  # push gh-pages, which Pages publishes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group docs
      - name: Commit this version to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true  # absent before the first deployment
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)
            uv run --group docs mike deploy --push --update-aliases "$version" latest
          elif uv run --group docs mike list | grep -v '^dev' | grep -q .; then
            uv run --group docs mike deploy --push dev
          else
            # No release yet: dev is what "latest" points to.
            uv run --group docs mike deploy --push --update-aliases dev latest
          fi
          uv run --group docs mike set-default --push latest
