name: Release

# Push a tag vX.Y.Z whose version matches pyproject.toml: the build is
# published to TestPyPI, then to PyPI, then released on GitHub. Running the
# workflow by hand (workflow_dispatch) publishes to TestPyPI only, to try
# the pipeline before tagging. Publishing uses trusted publishing: register
# this repository and this workflow file as a trusted publisher of the
# "diffcone" project on PyPI with the environment "pypi", and on TestPyPI
# with the environment "testpypi" (https://docs.pypi.org/trusted-publishers/).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version tried by hand before tagging is already there.
          skip-existing: true

  publish:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" {on = 1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "diffcone $version" --notes-file notes.md
