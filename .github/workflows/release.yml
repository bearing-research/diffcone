name: Release

# Push a tag vX.Y.Z whose version matches pyproject.toml. Publishing uses
# PyPI trusted publishing: register this repository, this workflow file and
# the environment "pypi" as a trusted publisher of the "diffcone" project
# on PyPI first (https://docs.pypi.org/trusted-publishers/).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: The tag names the version being built
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" {on = 1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "diffcone $version" --notes-file notes.md
