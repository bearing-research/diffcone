[project]
site_name = "diffcone"
site_description = "Which tests and benchmarks a change to Python code can affect, and why"
site_url = "https://bearing-research.github.io/diffcone/"
repo_url = "https://github.com/bearing-research/diffcone"
repo_name = "bearing-research/diffcone"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Bearing Research"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Planning" = "guides/planning.md" },
    { "Running and checking" = "guides/running.md" },
    { "Execution evidence" = "guides/evidence.md" },
    { "CI with GitHub Actions" = "ci.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/cli.md" },
    { "Target manifest" = "reference/manifest.md" },
    { "diffcone.toml" = "reference/declarations.md" },
    { "Report" = "reference/report.md" },
    { "Static discovery" = "reference/discovery.md" },
    { "Limitations" = "limitations.md" },
  ] },
  { "Background" = [
    { "Design" = "design.md" },
    { "Evidence design" = "evidence_design.md" },
    { "Evaluation" = "evaluation.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

# The changelog page includes CHANGELOG.md from the repository root.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
