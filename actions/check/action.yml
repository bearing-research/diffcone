name: diffcone check
description: >-
  Compare a diffcone plan with the JUnit XML of the full run of the same
  tests, and write the verdict (missed failures, tests run, test time) to
  the job summary. Exits non-zero only when fail-on-miss is true.
inputs:
  results:
    description: The directory diffcone run wrote (plan.json, diffcone.xml, baseline.xml).
    default: diffcone-results
  full:
    description: JUnit XML of the full run.
    required: true
  others:
    description: Further selective runs to compare, as space-separated NAME=JUNIT pairs (e.g. testmon=t.xml).
    default: ""
  fail-on-miss:
    description: Fail the step when the plan missed a failure.
    default: "false"
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: bash "$GITHUB_ACTION_PATH/../install.sh"
    - name: Check
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        FULL: ${{ inputs.full }}
        OTHERS: ${{ inputs.others }}
        FAIL: ${{ inputs.fail-on-miss }}
      run: |
        runs=()
        if [ -f "$RESULTS/diffcone.xml" ]; then
          runs+=(--run "diffcone=$RESULTS/diffcone.xml")
        else
          # No JUnit of diffcone's run (nothing was selected, or the run
          # never started): the check compares the plan only, and says so.
          echo "::warning::no $RESULTS/diffcone.xml: checking the plan only, not whether diffcone's run ran the selected tests"
        fi
        for o in $OTHERS; do runs+=(--run "$o"); done
        baseline=()
        [ -f "$RESULTS/baseline.xml" ] && baseline=(--baseline "$RESULTS/baseline.xml")
        status=0
        diffcone check --plan "$RESULTS/plan.json" --full "$FULL" \
          "${baseline[@]}" "${runs[@]}" --format markdown -o "$RUNNER_TEMP/verdict.md" || status=$?
        cat "$RUNNER_TEMP/verdict.md" >> "$GITHUB_STEP_SUMMARY"
        diffcone check --plan "$RESULTS/plan.json" --full "$FULL" \
          "${baseline[@]}" "${runs[@]}" --format json -o "$RESULTS/verdict.json" || true
        if [ "$status" -ge 2 ] || { [ "$status" -eq 1 ] && [ "$FAIL" = "true" ]; }; then
          exit "$status"
        fi
