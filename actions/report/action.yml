name: diffcone report
description: >-
  Report on the recent CI runs of diffcone run and diffcone record: download
  the results they uploaded (artifacts named with a common prefix), write
  the report to the job summary, comment it on a report issue, and open an
  issue for each confirmed miss. Run it on a schedule. The runs can be
  another public repository's, and the issues can go to another
  repository. Needs the gh CLI (GitHub-hosted runners have it) and the
  permissions actions: read and issues: write.
inputs:
  hours:
    description: >-
      The window when this workflow has no earlier report that posted (a
      successful run with report-label or miss-label set): runs that
      completed in this many hours before now. Otherwise the window starts
      where that report started, so no run falls between two reports.
    default: "24"
  workflow:
    description: Only the runs of this workflow (its file name, e.g. ci.yml); default all.
    default: ""
  artifact-prefix:
    description: The name prefix of the artifacts holding the actions' results.
    default: "diffcone-"
  repository:
    description: >-
      The repository whose runs are reported (owner/name); default this one.
      Another public repository's runs can be read with this workflow's own
      token.
    default: ${{ github.repository }}
  issues-repository:
    description: >-
      Where the report comment and the miss issues go (owner/name); default
      this one. Writing to another repository needs issues-token.
    default: ${{ github.repository }}
  issues-token:
    description: The token for writing issues; default github-token.
    default: ""
  comment:
    description: >-
      When to comment the report on the report issue: "always", or
      "on-problem" (a miss, a failed check, an incomplete report). The job
      summary always has it.
    default: "always"
  report-label:
    description: >-
      Comment the report on the open issue with this label (created when
      there is none); empty: the job summary only.
    default: "diffcone-report"
  miss-label:
    description: >-
      Open an issue with this label for each confirmed miss (a test and a
      commit), once; empty: no miss issues.
    default: "diffcone-miss"
  github-token:
    description: The token gh uses.
    default: ${{ github.token }}
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
outputs:
  ok:
    description: >-
      "true" when the report has no miss and no failed check. (A failing step
      after this action makes the next report cover this window again.)
    value: ${{ steps.report.outputs.ok }}
  report:
    description: The directory holding report.md and report.json.
    value: ${{ steps.report.outputs.report }}
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: |
        py=$(command -v python3 || command -v python)
        "$py" -m venv "$RUNNER_TEMP/diffcone"
        bin="$RUNNER_TEMP/diffcone/bin"
        [ -d "$bin" ] || bin="$RUNNER_TEMP/diffcone/Scripts"
        if [ -n "$REF" ]; then
          source="git+https://github.com/bearing-research/diffcone@$REF"
        else
          source="$GITHUB_ACTION_PATH/../.."
        fi
        "$bin/python" -m pip install --quiet "$source"
        echo "$bin" >> "$GITHUB_PATH"
    - name: Download the runs' results
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HOURS: ${{ inputs.hours }}
        WORKFLOW: ${{ inputs.workflow }}
        PREFIX: ${{ inputs.artifact-prefix }}
        RUNS: ${{ runner.temp }}/diffcone-runs
        RUNS_REPO: ${{ inputs.repository }}
        MARKER: posted-diffcone-report
      run: |
        py=$(command -v python3 || command -v python)
        mkdir -p "$RUNS/runs"
        # The window starts where this workflow's last successful report
        # that posted started (it uploaded the $MARKER artifact): a run that
        # was still going then, or that a delayed schedule skipped, is in
        # this report. A report that fails (a download that failed), or one
        # that only wrote its job summary, leaves its window to the next one.
        workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
        since=""
        while read -r id started; do
          [ -n "$id" ] || continue
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' < /dev/null \
            | tr -d '\r' | grep -qx "$MARKER"; then
            since=$started
            break
          fi
        done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?status=success&per_page=30" \
          --jq '.workflow_runs[] | "\(.id) \(.run_started_at)"' | tr -d '\r')
        window=$("$py" - "$HOURS" "$since" <<'PY'
        import datetime as d, sys
        now = d.datetime.now(d.timezone.utc)
        since = sys.argv[2]
        start = (
            d.datetime.fromisoformat(since.replace("Z", "+00:00"))
            if since
            else now - d.timedelta(hours=float(sys.argv[1]))
        )
        print(start.strftime("%Y-%m-%dT%H:%M:%SZ"))
        # A run that completed in the window may have been created days
        # before it (a queue, a long matrix): list from earlier.
        print((start - d.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ"))
        PY
        )
        window=$(echo "$window" | tr -d '\r')
        cutoff=$(echo "$window" | sed -n 1p)
        created=$(echo "$window" | sed -n 2p)
        only=(); [ -n "$WORKFLOW" ] && only=(--workflow "$WORKFLOW")
        # Completed runs only: one still running has not uploaded everything
        # (and the run of this report is one of them).
        gh run list --repo "$RUNS_REPO" "${only[@]}" --created ">=$created" \
          --status completed --limit 1000 \
          --json databaseId,url,event,createdAt,updatedAt,headSha,headBranch,workflowName,conclusion \
          > "$RUNS/runs.json"
        "$py" - "$RUNS/runs.json" "$cutoff" "$RUNS/runs" <<'PY' | tr -d '\r' > "$RUNS/ids"
        import json, os, sys
        runs = json.load(open(sys.argv[1]))
        if len(runs) >= 1000:
            # gh run list's limit: older runs of the window are cut off.
            print("::error::over 1000 runs to list; narrow the report with workflow", file=sys.stderr)
            open(os.path.join(sys.argv[3], "..", "truncated"), "w").close()
        for run in runs:
            if run["updatedAt"] < sys.argv[2]:
                continue
            directory = os.path.join(sys.argv[3], str(run["databaseId"]))
            os.makedirs(directory, exist_ok=True)
            json.dump(
                {
                    "id": run["databaseId"],
                    "url": run["url"],
                    "event": run["event"],
                    "created_at": run["createdAt"],
                    "completed_at": run["updatedAt"],
                    "head_sha": run["headSha"],
                    "head_branch": run["headBranch"],
                    "workflow": run["workflowName"],
                    "conclusion": run["conclusion"],
                },
                open(os.path.join(directory, "run.json"), "w"),
            )
            print(run["databaseId"])
        PY
        count=0; errors=0
        while read -r id; do
          if ! names=$(gh api --paginate "repos/$RUNS_REPO/actions/runs/$id/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.name | startswith(\"$PREFIX\")) | .name" \
            < /dev/null); then
            echo "::error::could not list the artifacts of run $id"
            errors=$((errors + 1))
            continue
          fi
          names=$(echo "$names" | tr -d '\r')
          if [ -z "$names" ]; then
            rm -rf "$RUNS/runs/$id"
            continue
          fi
          count=$((count + 1))
          while IFS= read -r name; do
            gh run download "$id" --repo "$RUNS_REPO" -n "$name" -D "$RUNS/runs/$id/$name" \
              < /dev/null && continue
            echo "::error::could not download $name of run $id"
            errors=$((errors + 1))
          done <<< "$names"
        done < "$RUNS/ids"
        [ -f "$RUNS/truncated" ] && errors=$((errors + 1))
        echo "$errors" > "$RUNS/errors"
        echo "$count run(s) completed since $cutoff uploaded results; $errors download error(s)"
    - name: Report
      id: report
      shell: bash
      env:
        RUNS: ${{ runner.temp }}/diffcone-runs
        OUT: ${{ runner.temp }}/diffcone-report
      run: |
        mkdir -p "$OUT" "$RUNS/runs"
        echo "report=$OUT" >> "$GITHUB_OUTPUT"
        status=0
        diffcone report --dir "$RUNS/runs" --format json -o "$OUT/report.json" || status=$?
        [ "$status" -ge 2 ] && exit "$status"
        diffcone report --dir "$RUNS/runs" -o "$OUT/report.md" || true
        errors=$(cat "$RUNS/errors" 2>/dev/null || echo 1)
        if [ "$errors" -gt 0 ]; then
          # The report is short of what was uploaded: say so on top, and
          # fail below so the next report covers this window again.
          { printf '**%s artifact(s) could not be listed or downloaded**: this report is incomplete, and the next one covers these runs again.\n\n' "$errors"
            cat "$OUT/report.md"; } > "$OUT/report.tmp" && mv "$OUT/report.tmp" "$OUT/report.md"
          status=1
        fi
        echo "errors=$errors" >> "$GITHUB_OUTPUT"
        cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -eq 0 ]; then echo "ok=true"; else echo "ok=false"; fi >> "$GITHUB_OUTPUT"
    - name: Comment the report and open miss issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.issues-token || inputs.github-token }}
        OUT: ${{ runner.temp }}/diffcone-report
        RUNS_REPO: ${{ inputs.repository }}
        ISSUES_REPO: ${{ inputs.issues-repository }}
        COMMENT: ${{ inputs.comment }}
        OK: ${{ steps.report.outputs.ok }}
        REPORT_LABEL: ${{ inputs.report-label }}
        MISS_LABEL: ${{ inputs.miss-label }}
      run: |
        py=$(command -v python3 || command -v python)
        VERSION=$(diffcone --version | tr -d '\r') "$py" - <<'PY'
        import json, os, re, subprocess, sys
        from urllib.parse import urlencode

        UPSTREAM = "bearing-research/diffcone"
        source = os.environ["RUNS_REPO"]
        repo = os.environ["ISSUES_REPO"]
        # Issues in another repository name the runs' repository: several
        # projects can report into one tracker.
        elsewhere = source != repo
        failed = 0
        out = os.environ["OUT"]


        def gh(*args):
            result = subprocess.run(
                ["gh", *args, "--repo", repo], check=True, capture_output=True, text=True
            )
            return result.stdout.strip()


        def label(name, description):
            gh("label", "create", name, "--force", "--description", description)


        def code(text):
            """A Markdown code span, whatever backticks the test id holds."""
            fence = "`" * (max((len(run) for run in re.findall("`+", text)), default=0) + 1)
            pad = " " if "`" in text else ""
            return f"{fence}{pad}{text}{pad}{fence}"


        def issue(title, body, name):
            url = gh("issue", "create", "--title", title, "--label", name, "--body", body)
            return url.rsplit("/", 1)[-1]


        if os.environ["COMMENT"] not in ("always", "on-problem"):
            sys.exit(f"comment must be always or on-problem, not {os.environ['COMMENT']!r}")
        wanted = os.environ["COMMENT"] == "always" or os.environ["OK"] != "true"
        if os.environ["REPORT_LABEL"] and wanted:
            name = os.environ["REPORT_LABEL"]
            title = f"diffcone report: {source}" if elsewhere else "diffcone report"
            label(name, "diffcone's reports over CI runs")
            found = json.loads(
                gh("issue", "list", "--label", name, "--state", "open", "--limit", "100",
                   "--json", "number,title")
            )
            numbers = [str(i["number"]) for i in found if i["title"] == title]
            number = min(numbers, key=int) if numbers else issue(
                title,
                f"diffcone's report action comments its reports over {source}'s CI runs here.",
                name,
            )
            gh("issue", "comment", number, "--body-file", os.path.join(out, "report.md"))
            print(f"commented the report on {repo}#{number}")

        report = json.load(open(os.path.join(out, "report.json")))
        if os.environ["MISS_LABEL"] and report["misses"]:
            name = os.environ["MISS_LABEL"]
            label(name, "a failing test diffcone did not select")
            existing = gh(
                "issue", "list", "--label", name, "--state", "all", "--limit", "1000",
                "--json", "body", "--jq", ".[].body",
            )
            grouped = {}
            for miss in report["misses"]:
                grouped.setdefault((miss["commit"], miss["test"]), []).append(miss)
            for (commit, test), found in grouped.items():
                marker = f"<!-- diffcone-miss {source} {commit} {test.replace('--', '- -')} -->"
                if marker in existing:
                    continue
                where = f"{source}@{commit}" if elsewhere else commit
                lines = [
                    f"{code(test)} failed in the full run of {where}, the plan of that commit's "
                    "change (its first parent to it) did not select it, and it failed again "
                    "when re-run (or could not be re-run).",
                    "",
                ]
                for miss in found:
                    reason = f"; the plan: {miss['plan_reason']}" if miss["plan_reason"] else ""
                    lines.append(f"- {miss['cell']} ({miss['kind']}): {miss['run']}{reason}")
                lines += [
                    "",
                    "The run's artifact holds the plan (plan.json) and the check's verdict.",
                ]
                if repo != UPSTREAM:
                    # A human decides what leaves this repository.
                    upstream = [
                        f"{os.environ['VERSION']} missed a test it should have selected.",
                        "",
                        f"- test: {code(test)} ({found[0]['kind']})",
                        f"- the plan: {found[0]['plan_reason'] or 'no reason recorded'}",
                        "",
                        "(Reported from a diffcone report; add what you can share: the "
                        "change, the code path from it to the test.)",
                    ]
                    query = urlencode(
                        {"title": f"Missed test: {test[:120]}", "body": "\n".join(upstream)}
                    )
                    lines += [
                        "",
                        "If this is diffcone's fault, [report it to diffcone]"
                        f"(https://github.com/{UPSTREAM}/issues/new?{query}) "
                        "(review the text first: nothing is sent until you submit it).",
                    ]
                lines += ["", marker]
                shown = test if len(test) <= 140 else test[:137] + "..."
                prefix = f"[{source}] " if elsewhere else ""
                try:
                    number = issue(
                        f"{prefix}diffcone missed {shown} at {commit[:12]}", "\n".join(lines), name
                    )
                except subprocess.CalledProcessError as exc:
                    print(f"::error::could not open an issue for {test}: {exc.stderr}")
                    failed += 1
                    continue
                print(f"opened {repo}#{number} for {test} at {commit[:12]}")
        sys.exit(1 if failed else 0)
        PY
    - name: Mark this report as posted
      # The next report's window starts where this one started.
      if: success() && (inputs.report-label != '' || inputs.miss-label != '')
      uses: actions/upload-artifact@v7
      with:
        name: posted-diffcone-report
        path: ${{ runner.temp }}/diffcone-report/report.json
        retention-days: 90
    - name: Fail on an incomplete report
      if: steps.report.outputs.errors != '0'
      shell: bash
      run: |
        echo "::error::some artifacts could not be read; the next report covers this window again"
        exit 1
