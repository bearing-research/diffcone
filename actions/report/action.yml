name: diffcone report
description: >-
  Report on the recent CI runs of diffcone run and diffcone record: download
  the results they uploaded (artifacts named with a common prefix), write
  the report to the job summary, comment it on a report issue, and open an
  issue for each confirmed miss. Run it on a schedule. Needs the gh CLI
  (GitHub-hosted runners have it) and the permissions actions: read and
  issues: write.
inputs:
  hours:
    description: >-
      The window when this workflow has no earlier successful run: runs that
      completed in this many hours before now. Otherwise the window starts
      where the last successful report started, so no run falls between two
      reports.
    default: "24"
  workflow:
    description: Only the runs of this workflow (its file name, e.g. ci.yml); default all.
    default: ""
  artifact-prefix:
    description: The name prefix of the artifacts holding the actions' results.
    default: "diffcone-"
  report-label:
    description: >-
      Comment the report on the open issue with this label (created when
      there is none); empty: the job summary only.
    default: "diffcone-report"
  miss-label:
    description: >-
      Open an issue with this label for each confirmed miss (a test and a
      commit), once; empty: no miss issues.
    default: "diffcone-miss"
  github-token:
    description: The token gh uses.
    default: ${{ github.token }}
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
outputs:
  ok:
    description: >-
      "true" when the report has no miss and no failed check. (A failing step
      after this action makes the next report cover this window again.)
    value: ${{ steps.report.outputs.ok }}
  report:
    description: The directory holding report.md and report.json.
    value: ${{ steps.report.outputs.report }}
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: |
        py=$(command -v python3 || command -v python)
        "$py" -m venv "$RUNNER_TEMP/diffcone"
        bin="$RUNNER_TEMP/diffcone/bin"
        [ -d "$bin" ] || bin="$RUNNER_TEMP/diffcone/Scripts"
        if [ -n "$REF" ]; then
          source="git+https://github.com/bearing-research/diffcone@$REF"
        else
          source="$GITHUB_ACTION_PATH/../.."
        fi
        "$bin/python" -m pip install --quiet "$source"
        echo "$bin" >> "$GITHUB_PATH"
    - name: Download the runs' results
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HOURS: ${{ inputs.hours }}
        WORKFLOW: ${{ inputs.workflow }}
        PREFIX: ${{ inputs.artifact-prefix }}
        RUNS: ${{ runner.temp }}/diffcone-runs
      run: |
        py=$(command -v python3 || command -v python)
        mkdir -p "$RUNS/runs"
        # The window starts where this workflow's last successful run
        # started: a run that was still going then, or that a delayed
        # schedule skipped, is in this report. A report that fails (a
        # download that failed) leaves its window to the next one.
        workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
        since=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?status=success&per_page=1" \
          --jq '.workflow_runs[0].run_started_at // empty')
        window=$("$py" - "$HOURS" "$since" <<'PY'
        import datetime as d, sys
        now = d.datetime.now(d.timezone.utc)
        since = sys.argv[2]
        start = (
            d.datetime.fromisoformat(since.replace("Z", "+00:00"))
            if since
            else now - d.timedelta(hours=float(sys.argv[1]))
        )
        print(start.strftime("%Y-%m-%dT%H:%M:%SZ"))
        # A run that completed in the window may have been created days
        # before it (a queue, a long matrix): list from earlier.
        print((start - d.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ"))
        PY
        )
        window=$(echo "$window" | tr -d '\r')
        cutoff=$(echo "$window" | sed -n 1p)
        created=$(echo "$window" | sed -n 2p)
        only=(); [ -n "$WORKFLOW" ] && only=(--workflow "$WORKFLOW")
        # Completed runs only: one still running has not uploaded everything
        # (and the run of this report is one of them).
        gh run list --repo "$GITHUB_REPOSITORY" "${only[@]}" --created ">=$created" \
          --status completed --limit 1000 \
          --json databaseId,url,event,createdAt,updatedAt,headSha,headBranch,workflowName,conclusion \
          > "$RUNS/runs.json"
        "$py" - "$RUNS/runs.json" "$cutoff" "$RUNS/runs" <<'PY' | tr -d '\r' > "$RUNS/ids"
        import json, os, sys
        runs = json.load(open(sys.argv[1]))
        if len(runs) >= 1000:
            # gh run list's limit: older runs of the window are cut off.
            print("::error::over 1000 runs to list; narrow the report with workflow", file=sys.stderr)
            open(os.path.join(sys.argv[3], "..", "truncated"), "w").close()
        for run in runs:
            if run["updatedAt"] < sys.argv[2]:
                continue
            directory = os.path.join(sys.argv[3], str(run["databaseId"]))
            os.makedirs(directory, exist_ok=True)
            json.dump(
                {
                    "id": run["databaseId"],
                    "url": run["url"],
                    "event": run["event"],
                    "created_at": run["createdAt"],
                    "completed_at": run["updatedAt"],
                    "head_sha": run["headSha"],
                    "head_branch": run["headBranch"],
                    "workflow": run["workflowName"],
                    "conclusion": run["conclusion"],
                },
                open(os.path.join(directory, "run.json"), "w"),
            )
            print(run["databaseId"])
        PY
        count=0; errors=0
        while read -r id; do
          if ! names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.name | startswith(\"$PREFIX\")) | .name" \
            < /dev/null); then
            echo "::error::could not list the artifacts of run $id"
            errors=$((errors + 1))
            continue
          fi
          names=$(echo "$names" | tr -d '\r')
          if [ -z "$names" ]; then
            rm -rf "$RUNS/runs/$id"
            continue
          fi
          count=$((count + 1))
          while IFS= read -r name; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$RUNS/runs/$id/$name" \
              < /dev/null && continue
            echo "::error::could not download $name of run $id"
            errors=$((errors + 1))
          done <<< "$names"
        done < "$RUNS/ids"
        [ -f "$RUNS/truncated" ] && errors=$((errors + 1))
        echo "$errors" > "$RUNS/errors"
        echo "$count run(s) completed since $cutoff uploaded results; $errors download error(s)"
    - name: Report
      id: report
      shell: bash
      env:
        RUNS: ${{ runner.temp }}/diffcone-runs
        OUT: ${{ runner.temp }}/diffcone-report
      run: |
        mkdir -p "$OUT" "$RUNS/runs"
        echo "report=$OUT" >> "$GITHUB_OUTPUT"
        status=0
        diffcone report --dir "$RUNS/runs" --format json -o "$OUT/report.json" || status=$?
        [ "$status" -ge 2 ] && exit "$status"
        diffcone report --dir "$RUNS/runs" -o "$OUT/report.md" || true
        errors=$(cat "$RUNS/errors" 2>/dev/null || echo 1)
        if [ "$errors" -gt 0 ]; then
          # The report is short of what was uploaded: say so on top, and
          # fail below so the next report covers this window again.
          { printf '**%s artifact(s) could not be listed or downloaded**: this report is incomplete, and the next one covers these runs again.\n\n' "$errors"
            cat "$OUT/report.md"; } > "$OUT/report.tmp" && mv "$OUT/report.tmp" "$OUT/report.md"
          status=1
        fi
        echo "errors=$errors" >> "$GITHUB_OUTPUT"
        cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -eq 0 ]; then echo "ok=true"; else echo "ok=false"; fi >> "$GITHUB_OUTPUT"
    - name: Comment the report and open miss issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OUT: ${{ runner.temp }}/diffcone-report
        REPORT_LABEL: ${{ inputs.report-label }}
        MISS_LABEL: ${{ inputs.miss-label }}
      run: |
        py=$(command -v python3 || command -v python)
        "$py" - <<'PY'
        import json, os, subprocess, sys

        repo = os.environ["GITHUB_REPOSITORY"]
        failed = 0
        out = os.environ["OUT"]


        def gh(*args, capture=True):
            result = subprocess.run(
                ["gh", *args, "--repo", repo], check=True, capture_output=capture, text=True
            )
            return result.stdout.strip() if capture else ""


        def label(name, description):
            gh("label", "create", name, "--force", "--description", description)


        def issue(title, body, name):
            url = gh("issue", "create", "--title", title, "--label", name, "--body", body)
            return url.rsplit("/", 1)[-1]


        if os.environ["REPORT_LABEL"]:
            name = os.environ["REPORT_LABEL"]
            label(name, "diffcone's reports over CI runs")
            numbers = gh(
                "issue", "list", "--label", name, "--state", "open", "--json", "number",
                "--jq", ".[].number",
            ).split()
            number = min(numbers, key=int) if numbers else issue(
                "diffcone report",
                "diffcone's report action comments its reports over CI runs here.",
                name,
            )
            gh("issue", "comment", number, "--body-file", os.path.join(out, "report.md"))
            print(f"commented the report on #{number}")

        report = json.load(open(os.path.join(out, "report.json")))
        if os.environ["MISS_LABEL"] and report["misses"]:
            name = os.environ["MISS_LABEL"]
            label(name, "a failing test diffcone did not select")
            existing = gh(
                "issue", "list", "--label", name, "--state", "all", "--limit", "1000",
                "--json", "body", "--jq", ".[].body",
            )
            grouped = {}
            for miss in report["misses"]:
                grouped.setdefault((miss["commit"], miss["test"]), []).append(miss)
            for (commit, test), found in grouped.items():
                marker = f"<!-- diffcone-miss {commit} {test} -->"
                if marker in existing:
                    continue
                lines = [
                    f"`{test}` failed in the full run of {commit}, the plan of that commit's "
                    "change (its first parent to it) did not select it, and it failed again "
                    "when re-run (or could not be re-run).",
                    "",
                ]
                for miss in found:
                    reason = f"; the plan: {miss['plan_reason']}" if miss["plan_reason"] else ""
                    lines.append(f"- {miss['cell']} ({miss['kind']}): {miss['run']}{reason}")
                lines += [
                    "",
                    "The run's artifact holds the plan (plan.json) and the check's verdict.",
                    "",
                    marker,
                ]
                shown = test if len(test) <= 160 else test[:157] + "..."
                try:
                    number = issue(
                        f"diffcone missed {shown} at {commit[:12]}", "\n".join(lines), name
                    )
                except subprocess.CalledProcessError as exc:
                    print(f"::error::could not open an issue for {test}: {exc.stderr}")
                    failed += 1
                    continue
                print(f"opened #{number} for {test} at {commit[:12]}")
        sys.exit(1 if failed else 0)
        PY
    - name: Fail on an incomplete report
      if: steps.report.outputs.errors != '0'
      shell: bash
      run: |
        echo "::error::some artifacts could not be read; the next report covers this window again"
        exit 1
