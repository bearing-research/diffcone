name: diffcone record
description: >-
  Record execution evidence for the checked-out commit (diffcone collect),
  warm and prune the cache to that commit, and save .diffcone/ with
  actions/cache for pull requests to restore. Run it on the default branch
  (on a schedule, or as the full test run of every push) in the environment
  the pull-request job uses. With check, it also verifies the previous
  recording: the commit's own change is planned from it, and every new
  failure of this full run must have been selected.
inputs:
  key-prefix:
    description: Cache key prefix naming the job this evidence stands for (one per environment).
    required: true
  command:
    description: The pytest command line, without arguments (e.g. "uv run python -m pytest").
    required: true
  pytest-args:
    description: Arguments passed to pytest (markers, -n, paths), as one shell-quoted string.
    default: ""
  env-vars:
    description: Space-separated environment variables that change what tests do (recorded and checked).
    default: ""
  source-roots:
    description: Space-separated source roots, as for diffcone plan.
    default: "."
  junit:
    description: Also write the recording run's JUnit XML here (kept in .diffcone/ as the baseline).
    default: ".diffcone/baseline.xml"
  check:
    description: >-
      Plan the commit's change (its first parent to it) from the previous
      recording, and fail when this full run has a new failure the plan did
      not select and that fails again when re-run. Use it when this job is
      the full test run of each push to the default branch.
    default: "false"
  fail-on-test-failure:
    description: Fail the job when a test fails (after saving the recording), as a plain test run would.
    default: "false"
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
outputs:
  misses:
    description: How many new failures the plan of the commit's change did not select (with check).
    value: ${{ steps.check.outputs.misses }}
  results:
    description: >-
      The directory to upload as an artifact (for diffcone report): the
      context.json describing this recording and, with check, the check's
      plan.json, verdict.json and verdict.md (and the re-run's results).
    value: ${{ steps.describe.outputs.results }}
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: |
        # The runner has this action's repository at the action's ref in
        # GITHUB_ACTION_PATH (actions/<name>), so diffcone matches the action.
        # ``python3`` is ``python`` on Windows runners, and a venv keeps its
        # programs in Scripts there.
        py=$(command -v python3 || command -v python)
        "$py" -m venv "$RUNNER_TEMP/diffcone"
        bin="$RUNNER_TEMP/diffcone/bin"
        [ -d "$bin" ] || bin="$RUNNER_TEMP/diffcone/Scripts"
        if [ -n "$REF" ]; then
          source="git+https://github.com/bearing-research/diffcone@$REF"
        else
          source="$GITHUB_ACTION_PATH/../.."
        fi
        "$bin/python" -m pip install --quiet "$source"
        echo "$bin" >> "$GITHUB_PATH"
    - name: Restore the previous recording
      if: inputs.check == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .diffcone
        key: ${{ inputs.key-prefix }}--${{ github.sha }}
        # This commit's own recording first: a re-run of the job then keeps
        # the verdict its earlier run reached, even after later pushes saved.
        restore-keys: |
          ${{ inputs.key-prefix }}--${{ github.sha }}-
          ${{ inputs.key-prefix }}--
    - name: Plan the commit's change
      if: inputs.check == 'true'
      id: plan
      shell: bash
      env:
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        ROOTS: ${{ inputs.source-roots }}
        # Outside the checkout: collect records only a clean working tree.
        RESULTS: ${{ runner.temp }}/diffcone-results
      run: |
        roots=(); for r in $ROOTS; do roots+=(--source-root "$r"); done
        eval "args=($PYTEST_ARGS)"
        py=$(command -v python3 || command -v python)
        mkdir -p "$RESULTS"
        echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
        head=$(git rev-parse HEAD)
        # A re-run of this commit's job restores its own recording and the
        # verdict it reached: that verdict stands (a miss stays a miss).
        if [ -f .diffcone/check.json ] && \
          [ "$("$py" -c "import json,sys; print(json.load(open(sys.argv[1]))['commit'])" .diffcone/check.json | tr -d '\r')" = "$head" ]; then
          cp .diffcone/check.json "$RESULTS/sticky.json"
          echo "::notice::an earlier run of this commit reached a verdict; keeping it"
          "$py" - "$RESULTS/sticky.json" > "$RESULTS/check-note" <<'PY'
        import json, sys
        verdict = json.load(open(sys.argv[1]))
        if verdict.get("checked", True):
            print("an earlier run of this commit was checked")
        else:
            why = verdict.get("check_note") or "no reason given"
            print(f"an earlier run of this commit was not checked: {why}")
        PY
          exit 0
        fi
        # The previous full run's results: failures it had are not misses.
        # Without them every failure already there would look like a miss.
        if [ ! -f .diffcone/baseline.xml ]; then
          echo "::notice::no previous full run to compare with; not checking this push"
          echo "no previous full run to compare with" > "$RESULTS/check-note"
          exit 0
        fi
        cp .diffcone/baseline.xml "$RESULTS/previous.xml"
        # A shallow checkout lacks the first parent.
        git rev-parse --verify --quiet "HEAD^1^{commit}" >/dev/null \
          || git fetch --quiet --deepen=1 origin "$head" 2>/dev/null || true
        if ! git rev-parse --verify --quiet "HEAD^1^{commit}" >/dev/null; then
          echo "::notice::the commit has no parent to compare with; not checking this push"
          echo "the commit has no parent" > "$RESULTS/check-note"
          exit 0
        fi
        # The verdict needs the recording the baseline came from: planned
        # from it, the change since that commit is covered, whatever lies
        # between it and the first parent.
        store=$(ls .diffcone/evidence/*.sqlite 2>/dev/null | head -1 || true)
        commit=$(basename "${store:-x}" | cut -d- -f1)
        if [ -z "$store" ] || ! { git cat-file -e "$commit^{commit}" 2>/dev/null \
          || git fetch --quiet --depth=1 origin "$commit" 2>/dev/null; }; then
          echo "::notice::the previous recording cannot be used here; not checking this push"
          echo "the previous recording cannot be fetched" > "$RESULTS/check-note"
          exit 0
        fi
        # It must come from before this commit: a later push's recording
        # (restored when this commit's own was never saved) has a baseline in
        # which this commit's new failures already fail. A shallow checkout
        # is deepened to the recording's date to tell.
        if ! git merge-base --is-ancestor "$commit" HEAD^1 2>/dev/null; then
          since=$(git log -1 --format=%ct "$commit" | tr -d '\r')
          git fetch --quiet --shallow-since="$(( since - 86400 ))" origin "$head" 2>/dev/null || true
        fi
        if ! git merge-base --is-ancestor "$commit" HEAD^1 2>/dev/null; then
          echo "::notice::the previous recording ($commit) is not from before this commit; not checking this push"
          echo "the previous recording is not from before this commit" > "$RESULTS/check-note"
          exit 0
        fi
        echo "$commit" > "$RESULTS/recording"
        rc=0
        diffcone plan --base HEAD^1 --head HEAD --discover pytest "${roots[@]}" \
          --evidence "$store" -o "$RESULTS/plan.json" -- "${args[@]}" || rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "the previous recording could not be used" > "$RESULTS/check-note"
          # A recording diffcone cannot read (other source roots, an older
          # store format) must not stop the recording itself.
          echo "::warning::the previous recording could not be used ($store); not checking this push"
          rm -f "$RESULTS/plan.json"
        fi
    - name: Record
      shell: bash
      env:
        PREFIX: ${{ inputs.key-prefix }}
        COMMAND: ${{ inputs.command }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        ENV_VARS: ${{ inputs.env-vars }}
        ROOTS: ${{ inputs.source-roots }}
        JUNIT: ${{ inputs.junit }}
      run: |
        roots=(); for r in $ROOTS; do roots+=(--source-root "$r"); done
        vars=(); for v in $ENV_VARS; do vars+=(--env-var "$v"); done
        eval "args=($PYTEST_ARGS)"
        mkdir -p "$(dirname "$JUNIT")"
        # The suite's own failures do not stop the recording; a broken
        # recording exits non-zero and nothing is saved.
        diffcone collect --command "$COMMAND" "${roots[@]}" "${vars[@]}" -- \
          "${args[@]}" "--junitxml=$JUNIT"
        # The next run's baseline is kept with the recording.
        [ "$JUNIT" -ef .diffcone/baseline.xml ] || cp "$JUNIT" .diffcone/baseline.xml
        rm -f .diffcone/check.json
        # Index and discover this commit once, so pull requests start warm.
        diffcone plan --base HEAD --head HEAD --discover pytest "${roots[@]}" \
          --evidence auto -o /dev/null -- "${args[@]}" || { rc=$?; [ $rc -eq 1 ] || [ $rc -eq 3 ]; }
        diffcone prune --keep HEAD "${roots[@]}"
        commit=$(git rev-parse HEAD)
        find .diffcone/evidence -name '*.sqlite' ! -name "$commit-*" -delete
        # ``--`` ends the prefix, so ``diffcone-ubuntu--`` never matches
        # ``diffcone-ubuntu-py312--...``; the run id makes every recording a
        # new entry, so a nightly on an unchanged branch still saves.
        echo "key=$PREFIX--$commit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      id: record
    - name: Check the plan against this full run
      if: inputs.check == 'true'
      id: check
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        JUNIT: ${{ inputs.junit }}
        RESULTS: ${{ runner.temp }}/diffcone-results
      run: |
        py=$(command -v python3 || command -v python)
        head=$(git rev-parse HEAD)
        flaky=0
        check_error=false
        record() {  # the verdict, kept with the recording for a re-run of this job
          MISSES=$1 FLAKY=$flaky CHECK_ERROR=$check_error HEAD_SHA=$head "$py" - <<'PY'
        import json, os
        results = os.environ["RESULTS"]
        try:
            note = open(os.path.join(results, "check-note")).read().strip() or None
        except OSError:
            note = None
        json.dump(
            {
                "commit": os.environ["HEAD_SHA"],
                "misses": int(os.environ["MISSES"]),
                "checked": os.path.exists(os.path.join(results, "plan.json")),
                "check_note": note,
                "check_error": os.environ["CHECK_ERROR"] == "true",
            },
            open(".diffcone/check.json", "w"),
        )
        PY
          { echo "misses=$1"; echo "flaky=$flaky"; echo "check-error=$check_error"; } >> "$GITHUB_OUTPUT"
        }
        if [ -f "$RESULTS/sticky.json" ]; then
          read -r misses check_error < <("$py" -c "import json,sys; v = json.load(open(sys.argv[1])); print(v['misses'], str(v.get('check_error', False)).lower())" "$RESULTS/sticky.json" | tr -d '\r')
          [ "$check_error" = true ] && echo "::error::the check of an earlier run of this commit failed"
          [ "$check_error" = true ] || [ "$misses" -eq 0 ] \
            || echo "::error::an earlier run of this commit found $misses miss(es) diffcone did not select"
          # The earlier verdict stands as it was written.
          cp "$RESULTS/sticky.json" .diffcone/check.json
          { echo "misses=$misses"; echo "flaky=0"; echo "check-error=$check_error"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "$RESULTS/plan.json" ]; then
          record 0
          exit 0
        fi
        status=0
        diffcone check --plan "$RESULTS/plan.json" --full "$JUNIT" --baseline "$RESULTS/previous.xml" \
          --format json -o "$RESULTS/verdict.json" || status=$?
        diffcone check --plan "$RESULTS/plan.json" --full "$JUNIT" --baseline "$RESULTS/previous.xml" \
          --format markdown -o "$RESULTS/verdict.md" || true
        cat "$RESULTS/verdict.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        if [ "$status" -ge 2 ]; then
          echo "::error::diffcone check failed (exit $status); see the log"
          check_error=true
          record 1
          exit 0
        fi
        misses=0
        if [ "$status" -eq 1 ]; then
          # A miss must fail again on its own: a flaky test is not one. Only
          # a test can be re-run; a file that failed to collect, or a failure
          # no target names, stands as found.
          if ! "$py" -c "
        import json, sys
        v = json.load(open(sys.argv[1]))
        kinds = {f['test']: f['kind'] for f in v['failures']}
        for test in v['misses']:
            print(kinds.get(test, 'unknown'), test)" "$RESULTS/verdict.json" > "$RESULTS/misses.txt"; then
            echo "::error::diffcone check found a miss but its verdict cannot be read"
            check_error=true
            record 1
            exit 0
          fi
          ids=(); other=0
          while IFS= read -r line; do
            line=${line%$'\r'}
            case "$line" in
              test\ *) ids+=("${line#test }") ;;
              ?*) other=$((other + 1)) ;;
            esac
          done < "$RESULTS/misses.txt"
          if [ ${#ids[@]} -eq 0 ] && [ "$other" -eq 0 ]; then
            echo "::error::diffcone check exited 1 but its verdict names no miss"
            check_error=true
            record 1
            exit 0
          fi
          confirmed=$other
          if [ ${#ids[@]} -gt 0 ]; then
            # The run's own options (markers, -W, plugins), but not its
            # paths: the re-run names the tests. A path after an option that
            # takes no value is a path (-ra, -v); after one that may take a
            # value it is kept, which only costs time.
            eval "args=($PYTEST_ARGS)"
            rerun=(); prev=""
            for a in "${args[@]}"; do
              if [[ "$a" != -* ]] && [ -e "${a%%::*}" ] && \
                { [ -z "$prev" ] || [[ "$prev" == *=* ]] || [[ "$prev" != -* ]] \
                  || [[ "$prev" =~ ^-[^-].+$ ]] || [[ "$prev" =~ ^-[vqxslh]$ ]]; }; then
                prev="$a"; continue
              fi
              rerun+=("$a"); prev="$a"
            done
            printf '%s\n' "${ids[@]}" > "$RESULTS/rerun-ids.txt"
            rc=0
            $COMMAND "${rerun[@]}" -p no:cacheprovider "--junitxml=$RESULTS/rerun.xml" "${ids[@]}" \
              > "$RESULTS/rerun.log" 2>&1 || rc=$?
            # Only the re-run tests count: anything else the re-run ran is
            # not a miss of this check. A re-run that cannot be read leaves
            # the misses standing.
            again=${#ids[@]}
            if [ -f "$RESULTS/rerun.xml" ] && [ "$rc" -lt 2 ]; then
              rs=0
              diffcone check --plan "$RESULTS/plan.json" --full "$RESULTS/rerun.xml" \
                --baseline "$RESULTS/previous.xml" --format json -o "$RESULTS/rerun-verdict.json" \
                || rs=$?
              if [ "$rs" -eq 0 ]; then
                again=0
              elif [ "$rs" -eq 1 ]; then
                again=$("$py" -c "
        import json, sys
        misses = set(json.load(open(sys.argv[1]))['misses'])
        ids = set(open(sys.argv[2]).read().splitlines())
        print(len(misses & ids))" "$RESULTS/rerun-verdict.json" "$RESULTS/rerun-ids.txt" | tr -d '\r') \
                  || again=${#ids[@]}
                [ -n "$again" ] || again=${#ids[@]}
              fi
            fi
            confirmed=$((confirmed + again))
            flaky=$(( ${#ids[@]} - again ))
            [ "$flaky" -gt 0 ] && \
              echo "::warning::$flaky unselected failure(s) passed when re-run (flaky); not counted as misses"
          fi
          misses=$confirmed
          [ "$misses" -gt 0 ] && echo "::error::diffcone missed $misses failing test(s) that fail again when re-run; see the job summary"
        fi
        record "$misses"
    - name: Save
      if: always() && steps.record.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: .diffcone
        key: ${{ steps.record.outputs.key }}
    - name: Describe the recording for diffcone report
      if: always()
      id: describe
      shell: bash
      env:
        RESULTS: ${{ runner.temp }}/diffcone-results
        CHECK: ${{ inputs.check }}
        RECORDED: ${{ steps.record.outcome }}
        MISSES: ${{ steps.check.outputs.misses }}
        FLAKY: ${{ steps.check.outputs.flaky }}
        CHECK_ERROR: ${{ steps.check.outputs.check-error }}
      run: |
        # What diffcone report reads about this recording, whatever
        # happened: written last, so a recording that failed is described too.
        echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
        "$(command -v python3 || command -v python)" - <<'PY'
        import json, os, subprocess
        results = os.environ["RESULTS"]
        os.makedirs(results, exist_ok=True)  # without check, nothing else made it
        def read(name):
            try:
                return open(os.path.join(results, name)).read().strip() or None
            except OSError:
                return None
        recorded = os.environ["RECORDED"] == "success"
        sticky = os.path.exists(os.path.join(results, "sticky.json"))
        checked = recorded and not sticky and os.path.exists(os.path.join(results, "plan.json"))
        if not recorded:
            note = "the recording failed"
        elif os.environ["CHECK"] != "true":
            note = "check is off"
        else:
            note = read("check-note")
        commit = subprocess.run(
            ["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True
        ).stdout.strip()
        json.dump(
            {
                "action": "record",
                "event": os.environ.get("GITHUB_EVENT_NAME", ""),
                "commit": commit,
                "recorded": recorded,
                "checked": checked,
                "check_note": None if checked else note or "not checked",
                "recording": read("recording"),
                "misses": int(os.environ["MISSES"] or 0),
                "flaky": int(os.environ["FLAKY"] or 0),
                "check_error": os.environ["CHECK_ERROR"] == "true",
                "sticky": sticky,
            },
            open(os.path.join(results, "context.json"), "w"),
            indent=1,
        )
        PY
    - name: Fail on test failures or misses
      if: always() && steps.record.outcome == 'success' && (inputs.check == 'true' || inputs.fail-on-test-failure == 'true')
      shell: bash
      env:
        JUNIT: ${{ inputs.junit }}
        FAIL_TESTS: ${{ inputs.fail-on-test-failure }}
        MISSES: ${{ steps.check.outputs.misses }}
      run: |
        failed=$("$(command -v python3 || command -v python)" - "$JUNIT" <<'PY'
        import sys, xml.etree.ElementTree as ET
        root = ET.parse(sys.argv[1]).getroot()
        suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
        print(sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites))
        PY
        )
        failed=${failed%$'\r'}
        status=0
        if [ "$FAIL_TESTS" = "true" ] && [ "${failed:-0}" -gt 0 ]; then
          echo "::error::$failed test(s) failed or errored"
          status=1
        fi
        if [ "${MISSES:-0}" -gt 0 ]; then
          status=1
        fi
        exit $status
