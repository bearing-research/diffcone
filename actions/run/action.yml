name: diffcone run
description: >-
  Restore the newest evidence saved by diffcone record for this job, plan
  the pull request against it and run only the selected tests, writing the
  plan and the run's JUnit XML to diffcone-results/ (upload it for
  diffcone check). Needs the same environment as the recording.
inputs:
  key-prefix:
    description: The key prefix diffcone record saved under.
    required: true
  command:
    description: The pytest command line, without arguments, exactly as recorded.
    required: true
  pytest-args:
    description: Arguments passed to pytest, as one shell-quoted string, exactly as recorded.
    default: ""
  source-roots:
    description: Space-separated source roots, as recorded.
    default: "."
  base:
    description: >-
      The base revision; default: the first parent of a pull request's merge
      commit (what the pull request changes on top of its target branch).
    default: "HEAD^1"
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
  allow-incomplete-discovery:
    description: >-
      Run the selection even when discovery says pytest may collect tests that
      are not targets (diffcone run --allow-incomplete-discovery). Tests pytest
      collects that the plan does not know are run as well.
    default: "false"
outputs:
  selected:
    description: How many tests the plan selected.
    value: ${{ steps.run.outputs.selected }}
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: |
        # The runner has this action's repository at the action's ref in
        # GITHUB_ACTION_PATH (actions/<name>), so diffcone matches the action.
        python3 -m venv "$RUNNER_TEMP/diffcone"
        if [ -n "$REF" ]; then
          source="git+https://github.com/bearing-research/diffcone@$REF"
        else
          source="$GITHUB_ACTION_PATH/../.."
        fi
        "$RUNNER_TEMP/diffcone/bin/pip" install --quiet "$source"
        echo "$RUNNER_TEMP/diffcone/bin" >> "$GITHUB_PATH"
    - name: Restore the evidence
      uses: actions/cache/restore@v6
      with:
        path: .diffcone
        key: ${{ inputs.key-prefix }}-${{ github.sha }}
        restore-keys: ${{ inputs.key-prefix }}-
    - name: Plan and run
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        ROOTS: ${{ inputs.source-roots }}
        BASE: ${{ inputs.base }}
        ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete-discovery }}
      run: |
        roots=(); for r in $ROOTS; do roots+=(--source-root "$r"); done
        eval "args=($PYTEST_ARGS)"
        mkdir -p diffcone-results
        store=$(ls .diffcone/evidence/*.sqlite 2>/dev/null | head -1 || true)
        evidence=()
        if [ -n "$store" ]; then
          commit=$(basename "$store" | cut -d- -f1)
          # A shallow checkout may lack the recorded commit.
          git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$commit"
          evidence=(--evidence "$store")
        else
          echo "::warning::no diffcone evidence restored; planning statically"
        fi
        cp .diffcone/baseline.xml diffcone-results/baseline.xml 2>/dev/null || true
        # The same pytest arguments as the run below (doctest options change
        # what discovery finds), so plan.json is the plan the run executes.
        diffcone plan --base "$BASE" --head HEAD --discover pytest "${roots[@]}" \
          "${evidence[@]}" -o diffcone-results/plan.json -- "${args[@]}" \
          || { rc=$?; [ $rc -eq 1 ] || [ $rc -eq 3 ]; }
        python3 -c "import json; p = json.load(open('diffcone-results/plan.json')); \
          print('selected=%d' % len(p['selected_targets']))" >> "$GITHUB_OUTPUT"
        allow=(); [ "$ALLOW_INCOMPLETE" = "true" ] && allow=(--allow-incomplete-discovery)
        diffcone run --base "$BASE" --head HEAD --discover pytest "${roots[@]}" \
          "${evidence[@]}" "${allow[@]}" --command "$COMMAND" -- \
          "${args[@]}" --junitxml=diffcone-results/diffcone.xml
