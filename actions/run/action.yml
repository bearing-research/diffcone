name: diffcone run
description: >-
  Restore the newest evidence saved by diffcone record for this job, plan
  the pull request against it and run only the selected tests, writing the
  plan and the run's JUnit XML to diffcone-results/ (upload it for
  diffcone check). Needs the same environment as the recording.
inputs:
  key-prefix:
    description: The key prefix diffcone record saved under.
    required: true
  command:
    description: The pytest command line, without arguments, exactly as recorded.
    required: true
  pytest-args:
    description: Arguments passed to pytest, as one shell-quoted string, exactly as recorded.
    default: ""
  source-roots:
    description: Space-separated source roots, as recorded.
    default: "."
  base:
    description: >-
      The base revision (a commit, a branch or tag name, or HEAD^1). Default:
      the event's own: for a pull request, the target branch it is merged
      onto (the merge commit's first parent, or the pull request's base
      commit when its head is checked out); for a push, the commit the
      branch pointed at before it; for a merge group, its base commit. When
      the event names none (a push that creates a branch, a manual run) or
      it is gone (a force push dropped it), every test is selected.
    default: ""
  diffcone-ref:
    description: >-
      Install diffcone from this git ref instead of from the action's own copy
      (by default the version of diffcone is the version of the action).
    default: ""
  allow-incomplete-discovery:
    description: >-
      Run the selection even when discovery says pytest may collect tests that
      are not targets (diffcone run --allow-incomplete-discovery). Tests pytest
      collects that the plan does not know are run as well.
    default: "false"
outputs:
  selected:
    description: >-
      How many tests the plan that ran selected (the static plan's when the
      environment differed from the recording's).
    value: ${{ steps.run.outputs.selected }}
runs:
  using: composite
  steps:
    - name: Install diffcone
      shell: bash
      env:
        REF: ${{ inputs.diffcone-ref }}
      run: bash "$GITHUB_ACTION_PATH/../install.sh"
    - name: Restore the evidence
      uses: actions/cache/restore@v6
      with:
        path: .diffcone
        key: ${{ inputs.key-prefix }}--${{ github.sha }}
        restore-keys: ${{ inputs.key-prefix }}--
    - name: Plan and run
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        ROOTS: ${{ inputs.source-roots }}
        BASE: ${{ inputs.base }}
        ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete-discovery }}
      run: |
        roots=(); for r in $ROOTS; do roots+=(--source-root "$r"); done
        eval "args=($PYTEST_ARGS)"
        mkdir -p diffcone-results
        py=$(command -v python3 || command -v python)
        source "$GITHUB_ACTION_PATH/../recording.sh"
        evidence=()
        recording=""
        note=""
        found=0
        find_recording || found=$?
        if [ "$found" -eq 0 ]; then
          evidence=(--evidence "$store")
          recording=$commit
        elif [ "$found" -eq 2 ]; then
          # A force-pushed branch may have lost the recorded commit: the
          # plan is static then.
          echo "::warning::the evidence recorded at $commit cannot be fetched; planning statically"
          note="the recorded commit $commit cannot be fetched"
        else
          echo "::warning::no diffcone evidence restored; planning statically"
          note="no recording restored"
        fi
        # What the report (diffcone report) reads about this run; finished
        # below, whatever the run's outcome.
        context() {
          "$py" - "$@" <<'PY'
        import json, os, sys
        plan_exit, run_exit = (int(a) if a != "" else None for a in sys.argv[1:3])
        json.dump(
            {
                "action": "run",
                "event": os.environ.get("GITHUB_EVENT_NAME", ""),
                "commit": os.environ["HEAD_SHA"],
                "base": os.environ["BASE_SHA"],
                "recording": os.environ.get("RECORDING") or None,
                "recording_note": os.environ.get("NOTE") or None,
                "base_note": os.environ.get("BASE_NOTE") or None,
                "allow_incomplete_discovery": os.environ.get("ALLOW_INCOMPLETE") == "true",
                "plan_exit": plan_exit,
                "run_exit": run_exit,
            },
            open("diffcone-results/context.json", "w"),
            indent=1,
        )
        PY
        }
        # The base: the input, or the event's own (base.sh says which). A
        # shallow checkout (actions/checkout's default depth 1) lacks it:
        # resolve_base deepens or fetches until it is there, and the plan
        # and the run get its commit. An event that names no base, or one
        # that cannot be fetched (a force push dropped it), selects every
        # test: planned from an empty commit, every target is new.
        source "$GITHUB_ACTION_PATH/../base.sh"
        base_note=""
        if [ -z "$BASE" ]; then
          event_base
          BASE=$base
        fi
        if [ -n "$BASE" ]; then
          if resolve_base; then
            BASE=$base_sha
          elif [ -n "$base_note" ]; then
            base_note="the base $BASE, $base_note, cannot be fetched"
            BASE=""
          fi
          # An input that does not resolve stays as given: the plan fails
          # on it (exit 2) and says why.
        fi
        if [ -z "$BASE" ]; then
          echo "::warning::no base to plan against ($base_note); selecting every test"
          BASE=$(empty_base)
          evidence=()
          recording=""
          note="no base to plan against: $base_note"
        fi
        cp .diffcone/baseline.xml diffcone-results/baseline.xml 2>/dev/null || true
        # The same pytest arguments and command as the run below (doctest
        # options change what discovery finds), so plan.json is the plan the
        # run executes.
        rc=0
        diffcone plan --base "$BASE" --head HEAD --discover pytest "${roots[@]}" \
          "${evidence[@]}" --command "$COMMAND" -o diffcone-results/plan.json -- "${args[@]}" \
          || rc=$?
        if [ "$rc" -eq 2 ] && [ ${#evidence[@]} -gt 0 ] \
          && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
          # A recording diffcone cannot use here (other source roots, an
          # older store format): plan from the code instead.
          echo "::warning::the restored recording could not be used; planning statically"
          evidence=()
          recording=""
          note="the restored recording could not be used"
          rc=0
          diffcone plan --base "$BASE" --head HEAD --discover pytest "${roots[@]}" \
            --command "$COMMAND" -o diffcone-results/plan.json -- "${args[@]}" || rc=$?
        fi
        export HEAD_SHA BASE_SHA BASE_NOTE RECORDING NOTE
        HEAD_SHA=$(git rev-parse HEAD)
        BASE_SHA=$(git rev-parse --verify --quiet "$BASE^{commit}" || echo "$BASE")
        BASE_NOTE=$base_note
        RECORDING=$recording
        NOTE=$note
        if ! { [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || [ "$rc" -eq 3 ]; }; then
          context "$rc" ""
          exit "$rc"
        fi
        allow=(); [ "$ALLOW_INCOMPLETE" = "true" ] && allow=(--allow-incomplete-discovery)
        # ``-o``: the plan that ran (the static one when the environment
        # differs from the recording's), for the report and the check.
        rm -f diffcone-results/ran.json
        status=0
        diffcone run --base "$BASE" --head HEAD --discover pytest "${roots[@]}" \
          "${evidence[@]}" "${allow[@]}" --command "$COMMAND" -o diffcone-results/ran.json -- \
          "${args[@]}" --junitxml=diffcone-results/diffcone.xml || status=$?
        context "$rc" "$status"
        # What ran, when the run wrote it; else what was planned.
        ran=diffcone-results/plan.json
        [ -f diffcone-results/ran.json ] && ran=diffcone-results/ran.json
        "$py" -c "import json, sys; p = json.load(open(sys.argv[1])); \
          print('selected=%d' % len(p['selected_targets']))" "$ran" | tr -d '\r' >> "$GITHUB_OUTPUT"
        exit "$status"
