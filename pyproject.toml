[project]
name = "diffcone"
version = "0.1.0"
description = "Static-first, function-level change-impact engine for Python: which tests and benchmarks a change can affect, and why"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bearing Research" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["test selection", "test impact analysis", "change impact", "pytest", "asv", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/bearing-research/diffcone"
Documentation = "https://bearing-research.github.io/diffcone/"
Repository = "https://github.com/bearing-research/diffcone"
Issues = "https://github.com/bearing-research/diffcone/issues"
Changelog = "https://github.com/bearing-research/diffcone/blob/main/CHANGELOG.md"

[project.scripts]
diffcone = "diffcone.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cython>=3.1",  # tests that build a profiled extension (evidence over Cython)
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "setuptools",  # builds those extensions
    "ty==0.0.84",  # pre-1.0: pinned, since new releases add checks
]
docs = [
    "zensical==0.0.68",  # pre-1.0: pinned
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"  # the oldest supported: newer APIs are flagged

[tool.ty.src]
include = ["src", "tests", "scripts"]
# A finished spike, kept as the record of what it measured (evidence_design.md).
exclude = ["scripts/evidence_spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
